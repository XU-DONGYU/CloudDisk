syntax="proto3";
package Sign;

message SignupReq {
    string username = 1;
    string password = 2;
}

message SignupResp{
    int32 status=1;
    string username=2;
}

message SigninReq{
    string username=1;
    string password=2;
}

message SigninResp{
    int32 status=1;
    string username=2;
    string token=3;
}

service Sign{
    rpc Signup(SignupReq) returns(SignupResp);
    rpc Signin(SigninReq) returns(SigninResp);
}
